<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NQZ2026 Macro Bias</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#12161c;--mut:#6b7482;--bd:#e4e7ec;--bull:#12915a;--bear:#d6403f;--neu:#8b94a3;--bullbg:rgba(18,145,90,.1);--bearbg:rgba(214,64,63,.1);--neubg:rgba(139,148,163,.14);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1015;--card:#161a22;--tx:#e9ecf1;--mut:#8a93a2;--bd:#252b36;--bull:#2fc783;--bear:#f26565;--neu:#7d8696;--bullbg:rgba(47,199,131,.12);--bearbg:rgba(242,101,101,.12);--neubg:rgba(125,134,150,.16);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
.bull{--c:var(--bull);--b:var(--bullbg)}.bear{--c:var(--bear);--b:var(--bearbg)}.neu{--c:var(--neu);--b:var(--neubg)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.tag{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mut)}
h1{margin:2px 0 0;font-size:24px;letter-spacing:-.02em}
.px{text-align:right}.px b{font-size:20px;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
.hero{text-align:center;padding:26px 18px 20px}
.state{font-size:36px;font-weight:700;letter-spacing:-.02em;color:var(--c)}
.num{font-size:15px;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
.gauge{position:relative;height:8px;border-radius:4px;margin:26px 8px 8px;background:linear-gradient(90deg,var(--bear),var(--neu) 50%,var(--bull));opacity:.85}
.zone{position:absolute;left:41%;width:18%;top:-3px;bottom:-3px;border-radius:6px;background:var(--card);opacity:.35}
.pin{position:absolute;top:-7px;width:6px;height:22px;border-radius:3px;background:var(--tx);border:2px solid var(--card);transform:translateX(-50%);transition:left .4s}
.ends{display:flex;justify-content:space-between;margin:0 8px;font-size:11px;color:var(--mut)}
.chips{display:flex;justify-content:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;background:var(--b);color:var(--c)}
.warn{display:none;margin-bottom:14px;padding:12px 14px;border-radius:12px;background:rgba(240,170,40,.14);border:1px solid rgba(240,170,40,.45);font-size:13px}
.warn b{display:block;margin-bottom:2px}
h2{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0 12px 12px;border-top:1px solid var(--bd);position:relative}
.row:first-of-type{border-top:0}
.row:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--c)}
.nm{font-weight:600}.nm span{color:var(--mut);font-weight:400;font-size:12px;margin-left:4px}
.why{color:var(--mut);font-size:13px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--b);color:var(--c);white-space:nowrap}
.hist{position:relative;display:flex;gap:3px;height:84px;margin-top:10px}
.hist:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--bd)}
.col{flex:1;position:relative}
.bar{position:absolute;left:0;right:0;border-radius:3px;background:var(--c);min-height:2px}
.hl{display:flex;justify-content:space-between;margin-top:6px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="tag">NQZ2026 · E-MINI NASDAQ-100</div><h1>Macro Bias</h1></div>
    <div class="px"><b id="px">–</b><div class="mut" id="up">Loading…</div></div>
  </header>

  <div class="warn" id="warn"></div>

  <section class="card hero neu" id="hero">
    <div class="state" id="state">–</div>
    <div class="num" id="num"></div>
    <div class="gauge"><div class="zone"></div><div class="pin" id="pin" style="left:50%"></div></div>
    <div class="ends"><span>Bearish</span><span>Neutral</span><span>Bullish</span></div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="card">
    <h2>Drivers</h2>
    <div id="drivers"></div>
  </section>

  <section class="card">
    <h2>Last 30 days</h2>
    <div class="hist" id="hist"></div>
    <div class="hl mut"><span id="h0"></span><span id="h1"></span></div>
    <div id="hrows" style="margin-top:10px"></div>
  </section>

  <footer>Updates automatically on weekdays around 8:00 ET · Data from Yahoo Finance · A directional lean, not a trade signal</footer>
</div>

<script>
var T={bull:"Bullish",bear:"Bearish",neu:"Neutral"};
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function tone(v){return v>0?"bull":v<0?"bear":"neu"}
function band(s){return s>=18?"bull":s<=-18?"bear":"neu"}
function fmt(s){return (s>0?"+":s<0?"−":"")+Math.abs(s)}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}

function render(d){
  var b=band(d.score);
  $("hero").className="card hero "+b;
  $("state").textContent=d.label;
  $("num").textContent="Score "+fmt(d.score)+" of ±100";
  $("pin").style.left=((d.score+100)/2)+"%";
  $("px").textContent=d.price?d.price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):"–";
  $("up").textContent="Updated "+new Date(d.updated).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});

  var n={bull:0,neu:0,bear:0};
  d.drivers.forEach(function(x){if(x.value!=null)n[tone(x.value)]++});
  var chips=$("chips");clear(chips);
  ["bull","neu","bear"].forEach(function(k){chips.appendChild(el("span","chip "+k,n[k]+" "+T[k].toLowerCase()))});

  var w=$("warn");
  if(d.events&&d.events.length){
    clear(w);w.appendChild(el("b",null,"High-impact USD events today"));
    w.appendChild(el("span",null,d.events.join("  ·  ")+". Consider waiting for the release and sizing down."));
    w.style.display="block";
  }else w.style.display="none";

  var dr=$("drivers");clear(dr);
  d.drivers.forEach(function(x){
    var k=x.value==null?"neu":tone(x.value),r=el("div","row "+k),a=el("div");
    var nm=el("div","nm",x.name);nm.appendChild(el("span",null,"weight "+x.weight));
    a.appendChild(nm);a.appendChild(el("div","why",x.reason));
    r.appendChild(a);r.appendChild(el("span","pill",x.value==null?"n/a":T[k]));
    dr.appendChild(r);
  });
}

function renderHist(h){
  var keys=Object.keys(h).sort().slice(-30),box=$("hist"),rows=$("hrows");
  clear(box);clear(rows);
  if(!keys.length){box.appendChild(el("div","mut","No history yet."));return}
  keys.forEach(function(k){
    var s=h[k].score,c=el("div","col "+band(s)),bar=el("div","bar"),p=Math.max(Math.abs(s)/2,1.5);
    bar.style.height=p+"%";if(s>=0)bar.style.bottom="50%";else bar.style.top="50%";
    c.title=k+": "+h[k].label+" "+fmt(s);c.appendChild(bar);box.appendChild(c);
  });
  $("h0").textContent=keys[0];$("h1").textContent=keys[keys.length-1];
  keys.slice(-7).reverse().forEach(function(k){
    var s=h[k].score,r=el("div","hrow "+band(s));
    r.appendChild(el("span",null,k+(h[k].event_risk?"  ·  event day":"")));
    r.appendChild(el("span","pill",h[k].label+" "+fmt(s)));
    rows.appendChild(r);
  });
}

function load(){
  fetch("data.json?"+Date.now()).then(function(r){return r.json()}).then(render)
    .catch(function(){$("up").textContent="No data yet. Run the workflow once."});
  fetch("history.json?"+Date.now()).then(function(r){return r.json()}).then(renderHist).catch(function(){});
}
load();setInterval(load,600000);
</script>
</body>
</html>
