name: Update NQ bias
on:
  schedule:
    - cron: "0 12 * * 1-5"
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas
      - run: python bias.py
      - run: |
          git config user.name "bias-bot"
          git config user.email "bias-bot@users.noreply.github.com"
          git add data.json history.json
          git diff --staged --quiet || (git commit -m "Update bias" && git push)
